name: Build Snapline 简体中文版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout localization project
        uses: actions/checkout@v4

      - name: Checkout upstream Snapline source
        uses: actions/checkout@v4
        with:
          repository: mohabujubara/snapline
          ref: main
          path: upstream

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply Simplified Chinese localization
        shell: pwsh
        run: ./scripts/apply-zh-cn.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable app and Windows installer
        shell: pwsh
        run: ./upstream/scripts/build.ps1 -Portable -Installer -Version 1.6.1

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item upstream/dist/portable/Snapline.exe out/Snapline-1.6.1-zh-cn-portable.exe
          $setup = Get-ChildItem upstream/dist/Snapline-*-Setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'Installer was not produced.' }
          Copy-Item $setup.FullName out/Snapline-1.6.1-zh-cn-Setup.exe
          Copy-Item upstream/LICENSE out/LICENSE-upstream-MIT.txt
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Snapline-ZH-CN
          path: out/*
          if-no-files-found: error
